<!DOCTYPE html>
<html>
<body style="text-align:center;font-family:Arial;background:#0f172a;color:white">
    <h1>Click the Box</h1>
    <p>Score: <span id="s">0</span> | Time: <span id="t">10</span></p>
    <div id="area" style="position:relative;width:300px;height:250px;margin:auto;background:#1e293b">
        <div id="box" style="position:absolute;width:50px;height:50px;background:#38bdf8;display:none"></div>
    </div>
    <br><button onclick="start()">Start</button>

    <script>
        let score, time, timer;

        function move() {
            box.style.left = Math.random() * 250 + "px";
            box.style.top = Math.random() * 200 + "px";
        }

        function start() {
            score = 0; time = 10;
            s.textContent = 0; t.textContent = 10;
            box.style.display = "block";
            move();
            clearInterval(timer);
            timer = setInterval(() => {
                t.textContent = --time;
                if (time == 0) {
                    clearInterval(timer);
                    box.style.display = "none";
                    alert("Score: " + score);
                }
            }, 1000);
        }

        box.onclick = () => { s.textContent = ++score; move(); };
    </script>
</body>
</html>
